# Isolated candidate: never install automatically or modify main.
# The main branch remains unchanged; only this isolated branch may trigger on push.
# Overlaid candidate app sources must already be in RokidLyricsIOS/.
# Place RealAVPCMChecks.swift in preflight/ before dispatch.
name: Isolated audio preflight (no deploy)
on:
  workflow_dispatch:
  push:
    branches:
      - codex/totti-sdk-preflight-20261029
permissions:
  contents: read
concurrency:
  group: isolated-audio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-sdk:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        audio: [legacy, duplex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Record exact source and Apple build environment
        run: |
          set -euo pipefail
          mkdir -p build
          { git rev-parse HEAD; xcodebuild -version; swiftc --version; } | tee build/environment.txt
      - name: Execute existing regression contracts for this audio variant
        env:
          AUDIO_VARIANT: ${{ matrix.audio }}
        run: |
          set -euo pipefail
          bash preflight/run-contracts.sh | tee build/contracts-${{ matrix.audio }}.txt
      - name: Compile and execute actual AVFoundation PCM-copy checks on macOS
        if: matrix.audio == 'duplex'
        run: |
          set -euo pipefail
          mkdir -p build
          swiftc -D TOTTI_EXPERIMENTAL_DUPLEX -parse-as-library RokidLyricsIOS/TottiSpeechPCM.swift preflight/RealAVPCMChecks.swift -o build/real-av-pcm
          build/real-av-pcm | tee build/real-av-pcm-results.txt
      - name: Execute callback queue using real MainActor and Dispatch
        if: matrix.audio == 'duplex'
        run: |
          set -euo pipefail
          swiftc -D TOTTI_EXPERIMENTAL_DUPLEX -parse-as-library RokidLyricsIOS/TottiAudioCallbackQueue.swift preflight/MainActorQueueChecks.swift -o build/mainactor-queue
          build/mainactor-queue | tee build/mainactor-queue-results.txt
      - name: Prepare the existing project and locked SDK dependencies
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - name: Build iOS app without signing or installing
        env:
          AUDIO_VARIANT: ${{ matrix.audio }}
        run: |
          set -euo pipefail
          command=(xcodebuild -workspace RokidLyricsIOS.xcworkspace -scheme RokidLyricsIOS -configuration Release -sdk iphoneos -destination generic/platform=iOS -derivedDataPath "build/DerivedData-$AUDIO_VARIANT" CODE_SIGNING_ALLOWED=NO)
          if [[ "$AUDIO_VARIANT" == duplex ]]; then
            command+=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) TOTTI_EXPERIMENTAL_DUPLEX')
          fi
          command+=(build)
          "${command[@]}" | tee "build/ios-$AUDIO_VARIANT-build.txt"
      - name: Package ad-hoc IPA for owner re-signing, never install
        env:
          AUDIO_VARIANT: ${{ matrix.audio }}
        run: bash preflight/package-ipa.sh
      - name: Upload isolated test package
        uses: actions/upload-artifact@v4
        with:
          name: totti-test-${{ matrix.audio }}-resignable
          path: |
            build/Totti-preflight-${{ matrix.audio }}-resignable.ipa
            build/Totti-preflight-${{ matrix.audio }}-resignable.ipa.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-preflight-${{ matrix.audio }}-logs
          path: |
            build/*.txt
            build/contracts-*/*.txt
