name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    env:
      SCHEME: RokidLyricsIOS
      WORKSPACE: RokidLyricsIOS.xcworkspace
      DEFAULT_BUNDLE_ID: com.anezium.rokidlyrics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen

      - name: Configure app bundle id
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail
          APP_BUNDLE_ID="${BUNDLE_ID:-$DEFAULT_BUNDLE_ID}"
          export APP_BUNDLE_ID
          perl -0pi -e 'my $default = $ENV{DEFAULT_BUNDLE_ID}; my $bundle = $ENV{APP_BUNDLE_ID}; s/PRODUCT_BUNDLE_IDENTIFIER: \Q$default\E\n/PRODUCT_BUNDLE_IDENTIFIER: $bundle\n/' project.yml
          grep 'PRODUCT_BUNDLE_IDENTIFIER' project.yml

      - name: Generate project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment

      - name: Build unsigned and resignable apps
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP_PATH"

          rm -rf build/unsigned
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          (cd build/unsigned && zip -qry ../RokidLyricsIOS-unsigned.ipa Payload)

          rm -rf build/resignable
          mkdir -p build/resignable/Payload
          cp -R "$APP_PATH" build/resignable/Payload/
          RESIGNABLE_APP="$(find build/resignable/Payload -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$RESIGNABLE_APP"
          if [ -d "$RESIGNABLE_APP/Frameworks" ]; then
            find "$RESIGNABLE_APP/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' framework; do
                codesign --force --sign - --timestamp=none "$framework"
              done
          fi
          codesign --force --sign - --timestamp=none "$RESIGNABLE_APP"
          codesign --verify --deep --strict --verbose=2 "$RESIGNABLE_APP"
          (cd build/resignable && zip -qry ../RokidLyricsIOS-resignable.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RokidLyricsIOS-unsigned
          path: build/RokidLyricsIOS-unsigned.ipa

      - name: Upload Feather-resignable IPA
        uses: actions/upload-artifact@v4
        with:
          name: RokidLyricsIOS-resignable
          path: build/RokidLyricsIOS-resignable.ipa

      - name: Check signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.IOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 || secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || format('ios-signing-{0}', github.run_id) }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROVISION_PROFILE_BASE64" ] && [ -n "$KEYCHAIN_PASSWORD" ] && [ -n "$BUNDLE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; signed IPA will be skipped."
          fi

      - name: Import signing assets
        if: steps.signing.outputs.enabled == 'true'
        id: import-signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.IOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 || secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || format('ios-signing-{0}', github.run_id) }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/"/ { print $2; exit }')"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No code signing identity found in imported PKCS#12."
            exit 1
          fi

          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"

          echo "Provisioning profile: $PROFILE_NAME"
          echo "Provisioning bundle id: $PROFILE_BUNDLE_ID"

          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "::error::Provisioning profile bundle id '$PROFILE_BUNDLE_ID' does not match BUNDLE_ID '$BUNDLE_ID'."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_path=$PP_PATH" >> "$GITHUB_OUTPUT"
          echo "profile_plist=$PROFILE_PLIST" >> "$GITHUB_OUTPUT"
          echo "signing_identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Package signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          PROFILE_PATH: ${{ steps.import-signing.outputs.profile_path }}
          PROFILE_PLIST: ${{ steps.import-signing.outputs.profile_plist }}
          SIGNING_IDENTITY: ${{ steps.import-signing.outputs.signing_identity }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP_PATH"

          rm -rf build/manual-signed
          mkdir -p build/manual-signed/Payload
          cp -R "$APP_PATH" build/manual-signed/Payload/

          SIGNED_APP="$(find build/manual-signed/Payload -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$SIGNED_APP"

          cp "$PROFILE_PATH" "$SIGNED_APP/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -x -c 'Print Entitlements' "$PROFILE_PLIST" > build/manual-signed/entitlements.plist

          if [ -d "$SIGNED_APP/Frameworks" ]; then
            find "$SIGNED_APP/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' framework; do
                codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$framework"
              done
          fi

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --entitlements build/manual-signed/entitlements.plist \
            --timestamp=none \
            "$SIGNED_APP"

          codesign --verify --deep --strict --verbose=2 "$SIGNED_APP"
          (cd build/manual-signed && zip -qry ../RokidLyricsIOS-signed.ipa Payload)

      - name: Upload signed IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RokidLyricsIOS-signed
          path: build/RokidLyricsIOS-signed.ipa
