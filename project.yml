name: RokidLyricsIOS

options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  RokidLyricsIOS:
    type: application
    platform: iOS
    sources:
      - path: RokidLyricsIOS
    resources:
      - path: RokidLyricsIOS/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.anezium.rokidlyrics
        PRODUCT_NAME: RokidLyricsIOS
        INFOPLIST_FILE: RokidLyricsIOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 32BW73UGAZ

  RokidLyricsIOSScreenshots:
    type: application
    platform: iOS
    sources:
      - path: RokidLyricsIOS
    resources:
      - path: RokidLyricsIOS/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.anezium.rokidlyrics.screenshots
        PRODUCT_NAME: RokidLyricsIOSScreenshots
        INFOPLIST_FILE: RokidLyricsIOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 32BW73UGAZ

  RokidLyricsIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RokidLyricsIOSTests
    dependencies:
      - target: RokidLyricsIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anezium.rokidlyrics.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 32BW73UGAZ

schemes:
  RokidLyricsIOS:
    build:
      targets:
        RokidLyricsIOS: all
    test:
      targets:
        - RokidLyricsIOSTests
    run:
      config: Debug
    archive:
      config: Release

  RokidLyricsIOSScreenshots:
    build:
      targets:
        RokidLyricsIOSScreenshots: all
    run:
      config: Debug
